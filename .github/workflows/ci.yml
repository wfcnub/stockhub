name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12

  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Superuser: integration tests create and drop their own scratch databases (needs CREATEDB)
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-throwaway@localhost:5432/postgres
      # Without this the Alembic integration tests skip instead of running
      TEST_DATABASE_URL: postgresql://postgres:ci-only-throwaway@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect what exists yet
        id: detect
        run: |
          echo "uv=$([ -f uv.lock ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tests=$([ -d tests ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ -f uv.lock ] || echo "::notice::backend/uv.lock not found: backend checks are skipped until it is committed"
          [ -d tests ] || echo "::notice::backend/tests not found: pytest is skipped"
      - name: Set up uv
        if: steps.detect.outputs.uv == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        if: steps.detect.outputs.uv == 'true'
        run: uv sync --frozen
      - name: Ruff lint
        if: steps.detect.outputs.uv == 'true'
        run: uv run ruff check .
      - name: Ruff format check
        if: steps.detect.outputs.uv == 'true'
        run: uv run ruff format --check .
      - name: Mypy (not blocking yet; make it required once it passes)
        if: steps.detect.outputs.uv == 'true'
        continue-on-error: true
        run: uv run mypy app indicators
      - name: Pytest
        if: steps.detect.outputs.uv == 'true' && steps.detect.outputs.tests == 'true'
        run: uv run pytest -q

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (runs when the script exists)
        run: |
          if [ "$(npm pkg get scripts.typecheck)" != "{}" ]; then npm run typecheck; else echo "::notice::no typecheck script yet"; fi
      - name: Tests (run when the script exists)
        run: |
          if [ "$(npm pkg get scripts.test)" != "{}" ]; then npm test; else echo "::notice::no test script yet"; fi
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build

  docker:
    name: Docker (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect
        id: detect
        run: |
          if [ "${{ matrix.name }}" = "backend" ] && [ ! -f backend/uv.lock ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/uv.lock not found: backend image build skipped"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.name }}/Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.detect.outputs.build == 'true'
      - name: Build (no push)
        if: steps.detect.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.name }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose:
    name: Compose files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate dev compose
        run: docker compose -f docker-compose.yml config -q
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
      - name: Validate prod compose
        run: docker compose -f docker-compose.prod.yml config -q
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
          STOCKHUB_TAG: ci
      - name: Dev compose must fail without a password
        run: |
          if docker compose -f docker-compose.yml config -q 2>/dev/null; then
            echo "dev compose accepted a missing POSTGRES_PASSWORD"; exit 1
          fi
