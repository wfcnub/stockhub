# StockHub local development stack (source bind-mounted, reload on change).
# Copy .env.example to .env and set POSTGRES_PASSWORD first: no password lives in this file.
# For deployment use docker-compose.prod.yml.
name: stockhub-dev

services:
  db:
    image: postgres:18-alpine
    container_name: stockhub-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-stockhub}
    ports:
      # Loopback only: not reachable from the LAN
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker, so mount the parent
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    container_name: stockhub-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockhub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stockhub}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: stockhub-frontend
    environment:
      # Dev talks to the API directly; deployment uses the relative /api/v1 through Next
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres18_data:
