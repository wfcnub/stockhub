# Alembic configuration for the StockHub backend.
# The database URL is NOT set here: migrations/env.py reads it from app.config.settings
# (DATABASE_URL in the environment or backend/.env). Run from backend/:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "short description"

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Readable, sortable filenames: 0001_baseline.py, 0002_..., with explicit --rev-id.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = %(here)s/.venv/bin/ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
