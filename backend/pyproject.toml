[project]
name = "stockhub-backend"
version = "1.1.0"
description = "StockHub Backend API"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.163,<0.164",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1.8,<2.2",
    "psycopg[binary]>=3.3.9,<3.4",
    "alembic>=1.20,<1.21",
    # pandas stays on 2.3.x until the indicator golden tests exist (pandas 3 is its own PR).
    "pandas==2.3.3",
    "numpy>=2.3.3,<2.4",
    "yfinance>=1.8,<2",
    "curl-cffi>=0.17,<0.18",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-cov>=7.1",
    "httpx2>=2.16,<3",  # Starlette TestClient prefers httpx2; plain httpx is deprecated there
    "ruff==0.17.5",
    "mypy>=2.4,<3",
    "pre-commit>=4.7",
]

[tool.uv]
# Application, not a library: no build backend, uv only manages the venv and lock.
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.isort]
known-first-party = ["app", "indicators"]

[tool.mypy]
python_version = "3.14"
# Non-blocking for now (run manually / in CI as informational). Tighten per package later.
strict = false
ignore_missing_imports = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/", "^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
